# Include this location inside the existing HTTPS server block.
#
# The media route is served by the authenticated application's public,
# revision-aware API. Do not use alias/root to expose MORKAHJA_CONTENT_ROOT.
# Keep the existing static /game/ location for legacy bundled artwork.

location ^~ /game-data/media/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    proxy_buffering on;
    proxy_cache off;
    proxy_intercept_errors off;

    # Preserve the application's Content-Type, ETag and immutable Cache-Control.
    # Do not add a blanket expires rule or rewrite Cache-Control in this location.
}

# The authenticated raw WebP staging endpoint accepts files up to 4 MiB.
# Keep the exact path so the larger request limit does not affect other API routes.
location = /game-data/admin/content/assets/stage {
    client_max_body_size 4m;
    client_body_timeout 30s;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_request_buffering on;
}
