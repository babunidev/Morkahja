name: release-gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: morkahja
        ports:
          - 4242:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d morkahja"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:4242/morkahja
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Verify static data sync
        run: npm run verify:static-data
      - name: Server session auth test
        run: npm run test:session-auth --prefix server
      - name: Server persistence concurrency test
        run: npm run test:persistence --prefix server
      - name: Server achievements test
        run: npm run test:achievements --prefix server
      - name: Server dice test
        run: npm run test:dice --prefix server
      - name: Client build
        run: npm run build --prefix client
      - name: Typecheck
        run: npm run typecheck --prefix shared && npm run typecheck --prefix server
